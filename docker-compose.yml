networks:
  aether-net:
    external: true

services:
  traefik:
    image: "traefik:v2.11"
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}"
      - "CF_DNS_API_TOKEN_FILE=/run/secrets/olympus_cf_dns_api_token"
      - "DOCKER_API_VERSION=1.44"
      # Static Configuration (Moved from command to Env for proper merging)
      - "TRAEFIK_LOG_LEVEL=INFO"
      - "TRAEFIK_API_DASHBOARD=true"
      - "TRAEFIK_PROVIDERS_DOCKER=true"
      - "TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false"
      - "TRAEFIK_PROVIDERS_DOCKER_SWARMMODE=true"
      - "TRAEFIK_PROVIDERS_DOCKER_NETWORK=aether-net"
      - "TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80"
      - "TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443"
      # Global HTTP to HTTPS redirection
      - "TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO=websecure"
      - "TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME=https"
      - "TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT=true"
      # Cloudflare Resolver
      - "TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL=${CLOUDFLARE_EMAIL}"
      - "TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_STORAGE=/letsencrypt/acme.json"
      - "TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_DNSCHALLENGE_PROVIDER=cloudflare"
      - "TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_DNSCHALLENGE_RESOLVERS=1.1.1.1:53,8.8.8.8:53"
    networks:
      - aether-net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-data:/letsencrypt" # Persist ACME certificates
    secrets:
      - source: olympus_cf_dns_api_token
        target: olympus_cf_dns_api_token
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # Dashboard Router
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${CLOUDFLARE_DOMAIN}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=cloudflare"
        - "traefik.http.routers.traefik-dashboard.tls.domains[0].main=${CLOUDFLARE_DOMAIN}"
        - "traefik.http.routers.traefik-dashboard.tls.domains[0].sans=*.${CLOUDFLARE_DOMAIN}"
        - "traefik.http.routers.traefik-dashboard.middlewares=authelia"
        - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"
        - "traefik.docker.network=aether-net"
        # --- HOMEPAGE LABELS ---
        - "homepage.group=Infrastructure"
        - "homepage.name=Traefik"
        - "homepage.icon=traefik.png"
        - "homepage.href=https://traefik.${CLOUDFLARE_DOMAIN}"
        - "homepage.description=Reverse Proxy"

  cloudflared:
    image: "cloudflare/cloudflared:latest"
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=false"

  portainer:
    image: portainer/portainer-ce:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.${CLOUDFLARE_DOMAIN}`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.tls=true"
        - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
        - "traefik.http.routers.portainer.tls.domains[0].main=${CLOUDFLARE_DOMAIN}"
        - "traefik.http.routers.portainer.tls.domains[0].sans=*.${CLOUDFLARE_DOMAIN}"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        # --- HOMEPAGE LABELS ---
        - "homepage.group=Infrastructure"
        - "homepage.name=Portainer"
        - "homepage.icon=portainer.png"
        - "homepage.href=https://portainer.${CLOUDFLARE_DOMAIN}"
        - "homepage.description=Container Management"

  portainer-agent:
    image: portainer/agent:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - aether-net
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      labels:
          - "traefik.enable=false"

  watchtower:
    image: containrrr/watchtower
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *  # 4 AM Daily (Cron Syntax)
      - DOCKER_API_VERSION=1.44 # Force compatible API version
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_docker
        target: /app/config/docker.yaml
    environment:
      - PUID=0
      - PGID=0
      - HOMEPAGE_ALLOWED_HOSTS=zeus.${CLOUDFLARE_DOMAIN}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_LIDARR_API_KEY=${LIDARR_API_KEY}
      - HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY=${AUDIOBOOKSHELF_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_JELLYSTAT_API_KEY=${JELLYSTAT_API_KEY}
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.homepage.rule=Host(`zeus.${CLOUDFLARE_DOMAIN}`)"
        - "traefik.http.routers.homepage.entrypoints=websecure"
        - "traefik.http.routers.homepage.tls=true"
        - "traefik.http.routers.homepage.middlewares=authelia"
        - "traefik.http.services.homepage.loadbalancer.server.port=3000"

volumes:
  traefik-data:
  portainer_data:

configs:
  homepage_settings:
    file: ./homepage-config/settings.yaml
  homepage_services:
    file: ./homepage-config/services.yaml
  homepage_widgets:
    file: ./homepage-config/widgets.yaml
  homepage_docker:
    file: ./homepage-config/docker.yaml

secrets:
  olympus_cf_dns_api_token:
    external: true
    name: ${OLYMPUS_CF_DNS_API_TOKEN_NAME}
