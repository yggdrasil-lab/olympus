name: Deploy to Gaia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Secrets
        env:
          CF_DNS_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "OLYMPUS_CF_DNS_API_TOKEN_NAME=$(echo "$CF_DNS_TOKEN" | /tmp/ensure_secret.sh olympus_cf_dns_api_token)" >> $GITHUB_ENV

      - name: Deploy Stack
        env:
          # Environment Config
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_DOMAIN: ${{ vars.DOMAIN_NAME }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          LIDARR_API_KEY: ${{ secrets.LIDARR_API_KEY }}
          AUDIOBOOKSHELF_API_KEY: ${{ secrets.AUDIOBOOKSHELF_API_KEY }}
          SEERR_API_KEY: ${{ secrets.SEERR_API_KEY }}
          JELLYSTAT_API_KEY: ${{ secrets.JELLYSTAT_API_KEY }}
          KOMGA_API_KEY: ${{ secrets.KOMGA_API_KEY }}
          STACK_NAME: olympus
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "olympus" docker-compose.yml