---
- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://muspelheim:8080
        description: Torrent Client
        siteMonitor: http://qbittorrent:8080

    - SABnzbd:
        icon: sabnzbd.png
        href: http://muspelheim:8085
        description: Usenet Client
        siteMonitor: http://sabnzbd:8085

    - slskd:
        icon: slskd.png
        href: http://muspelheim:5030
        description: Soulseek Client
        siteMonitor: http://slskd:5030

- Cluster Nodes:
    - Gaia:
        icon: si-debian
        href: https://grafana.tienzo.net
        description: Manager Node (192.168.86.166)
        widget:
          type: prometheusmetric
          url: http://tasks.argus_prometheus:9090
          refreshInterval: 10000
          metrics:
            - label: Uptime
              query: node_time_seconds - node_boot_time_seconds{instance="gaia"}
              format:
                type: duration
            - label: RAM Used
              query: node_memory_MemTotal_bytes{instance="gaia"} - node_memory_MemAvailable_bytes{instance="gaia"}
              format:
                type: bytes
            - label: Disk Free
              query: node_filesystem_avail_bytes{instance="gaia",mountpoint="/"}
              format:
                type: bytes
            - label: Load (1m)
              query: node_load1{instance="gaia"}
              format:
                type: number
                options:
                  maximumFractionDigits: 2

    - Muspelheim:
        icon: si-debian
        href: https://grafana.tienzo.net
        description: Worker Node (192.168.86.185)
        widget:
          type: prometheusmetric
          url: http://tasks.argus_prometheus:9090
          refreshInterval: 10000
          metrics:
            - label: Uptime
              query: node_time_seconds - node_boot_time_seconds{instance="muspelheim"}
              format:
                type: duration
            - label: RAM Used
              query: node_memory_MemTotal_bytes{instance="muspelheim"} - node_memory_MemAvailable_bytes{instance="muspelheim"}
              format:
                type: bytes
            - label: Disk Free
              query: node_filesystem_avail_bytes{instance="muspelheim",mountpoint="/"}
              format:
                type: bytes
            - label: Load (1m)
              query: node_load1{instance="muspelheim"}
              format:
                type: number
                options:
                  maximumFractionDigits: 2
