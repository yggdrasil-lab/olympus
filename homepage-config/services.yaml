---
- Cluster Nodes:
    - Gaia:
        icon: debian.png
        href: https://grafana.tienzo.net
        description: Manager Node (192.168.86.166)
        widget:
          type: prometheusmetric
          url: http://tasks.argus_prometheus:9090
          refreshInterval: 10000
          metrics:
            - label: CPU
              query: 100 - (avg(rate(node_cpu_seconds_total{mode="idle",instance="gaia"}[5m])) * 100)
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1
            - label: RAM
              query: (1 - (node_memory_MemAvailable_bytes{instance="gaia"} / node_memory_MemTotal_bytes{instance="gaia"})) * 100
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1
            - label: Disk
              query: (1 - (node_filesystem_avail_bytes{instance="gaia",mountpoint=~"/|/rootfs"} / node_filesystem_size_bytes{instance="gaia",mountpoint=~"/|/rootfs"})) * 100
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 1

    - Muspelheim:
        icon: debian.png
        href: https://grafana.tienzo.net
